name: Build GreetMate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.8 mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build and remap mod
        run: gradle --no-daemon clean build

      - name: Prepare remapped release JAR
        shell: bash
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name 'greetmate-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          echo "Release JARs:"
          ls -lah dist
          test "$(find dist -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: GreetMate-Minecraft-1.21.8
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
