name: Publish GreetMate Release

on:
  workflow_run:
    workflows: ["Build GreetMate"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: greetmate-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure this is the latest main build
        id: freshness
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$RUN_SHA" != "$MAIN_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $RUN_SHA; main is now $MAIN_SHA."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Read release version
        if: steps.freshness.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '\r')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the JAR from this successful build
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: GreetMate-Minecraft-1.21.8
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Publish or refresh GitHub Release
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          JAR="$(find dist -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$JAR"
          JAR_NAME="$(basename "$JAR")"

          {
            printf '## GreetMate %s\n\n' "$VERSION"
            printf 'Клиентский Fabric-мод для Minecraft 1.21.8.\n\n'
            printf '### Что нового\n'
            printf '%s\n' '- Быстрое радиальное колесо: сначала выбор онлайн-игрока из TAB, затем одной из его сохранённых фраз.'
            printf '%s\n' '- Настраиваемый бинд колеса (по умолчанию H) и отдельный бинд настроек (G).'
            printf '%s\n' '- Автоприветствия можно включать отдельно; кеш сессии не допускает повторов при скрытии/возврате в TAB.'
            printf '%s\n' '- Можно редактировать уже сохранённые фразы: выбери строку, измени текст и нажми «Сохранить».'
            printf '%s\n' '- Исправлено вертикальное выравнивание подписей, строк и кнопок главного GUI.'
            printf '%s\n' '- Настройки старых версий переносятся без удаления сохранённых ников и сообщений.'
            printf '\n### Установка\n'
            printf 'Помести файл %s в папку .minecraft/mods.\n' "$JAR_NAME"
            printf 'Нужны Fabric Loader и Fabric API для Minecraft 1.21.8.\n'
          } > release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "GreetMate $VERSION" --notes-file release-notes.md
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GreetMate $VERSION" \
              --notes-file release-notes.md \
              --target "$TARGET_SHA" \
              --latest
          fi
