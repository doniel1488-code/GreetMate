name: Publish GreetMate Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build and remap mod
        run: gradle --no-daemon clean build

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '\r')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GreetMate ${{ steps.version.outputs.version }}
          body: |
            ## GreetMate ${{ steps.version.outputs.version }}

            Клиентский Fabric-мод для персональных приветствий в Minecraft 1.21.8.

            - **G** — настройки ников и их сохранённых фраз.
            - **H** — радиальное колесо: сначала выбор игрока из TAB, затем своей фразы.
            - Можно редактировать сохранённые фразы.
            - Автоприветствия и кеш сессии защищают от повторных сообщений при обновлениях TAB.
            - Фирменная иконка встроена в мод и отображается в списке Fabric.

            Требуются Minecraft Java Edition 1.21.8, Java 21, Fabric Loader и Fabric API.

            - [Установщик Fabric Loader](https://fabricmc.net/use/installer/)
            - [Fabric API 0.136.1+1.21.8](https://modrinth.com/mod/fabric-api/versions?g=1.21.8&l=fabric)
            - [Java 21 (Eclipse Temurin)](https://adoptium.net/temurin/releases/?version=21)
            - [Инструкция по установке модов Fabric](https://docs.fabricmc.net/players/installing-mods)

            Исходный код: https://github.com/doniel1488-code/GreetMate
          files: build/libs/greetmate-*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
